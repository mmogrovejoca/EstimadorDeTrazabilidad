<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estimador de Tiempos de Trazabilidad</title>
    <link rel="stylesheet" href="https://cdn.dhtmlx.com/gantt/edge/dhtmlxgantt.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

        :root {
            --primary-color: #6c5ce7;
            --secondary-color: #a29bfe;
            --background-color: #f5f6fa;
            --text-color: #3d3d3d;
            --white-color: #ffffff;
            --border-radius: 12px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        nav {
            background-color: var(--primary-color);
            color: var(--white-color);
            padding: 1rem 0;
            box-shadow: var(--shadow);
        }

        nav .container {
            display: flex;
            align-items: center;
        }

        .logo-placeholder {
            width: 50px;
            height: 50px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            margin-right: 1rem;
        }

        nav h1 {
            font-size: 1.8rem;
            margin: 0;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }

        .form-container, .result-container {
            background-color: var(--white-color);
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .gantt-container {
            margin-top: 2rem;
            background-color: var(--white-color);
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
        }

        button {
            display: block;
            width: 100%;
            padding: 1rem;
            background-image: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: var(--white-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
        }

        .result-container h2 {
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 0.5rem;
        }

        .result-container p {
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .result-container span {
            font-weight: bold;
            color: var(--primary-color);
        }

        .gantt-controls {
            text-align: right;
            margin-top: 1rem;
        }

        .gantt-controls button {
            width: auto;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
        }

        .gantt_container {
            border-radius: var(--border-radius);
            overflow: hidden;
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <div class="logo-placeholder"></div>
            <h1>Estimador de Trazabilidad</h1>
        </div>
    </nav>
    <div class="container">
        <div class="main-container">
            <div class="form-container">
                <form id="estimation-form">
                    <!-- Form fields -->
                    <div class="form-group">
                        <label for="script-count">Cantidad de Scripts:</label>
                        <input type="number" id="script-count" required>
                    </div>
                    <div class="form-group">
                        <label for="min-lines">Longitud Mínima de Líneas:</label>
                        <input type="number" id="min-lines" required>
                    </div>
                    <div class="form-group">
                        <label for="max-lines">Longitud Máxima de Líneas:</label>
                        <input type="number" id="max-lines" required>
                    </div>
                    <div class="form-group">
                        <label for="person1-avg">Promedio de Avance Persona 1 (líneas/día):</label>
                        <input type="number" id="person1-avg" required>
                    </div>
                    <div class="form-group">
                        <label for="person2-avg">Promedio de Avance Persona 2 (líneas/día, opcional):</label>
                        <input type="number" id="person2-avg">
                    </div>
                    <div class="form-group">
                        <label for="start-date">Fecha de Inicio:</label>
                        <input type="date" id="start-date" required>
                    </div>
                    <div class="form-group">
                        <label for="due-date">Fecha de Cierre Estimada:</label>
                        <input type="date" id="due-date" required>
                    </div>
                    <button type="submit">Calcular Estimación</button>
                </form>
            </div>
            <div class="result-container">
                <h2>Resultados</h2>
                <p>Fecha de Estimación: <span id="estimation-date"></span></p>
                <p>Fecha de Cierre Calculada: <span id="calculated-due-date"></span></p>
                <p>Fecha de Cierre Recomendada: <span id="recommended-due-date"></span></p>
                <p>Validación de Fecha de Cierre: <span id="due-date-validation"></span></p>
            </div>
        </div>
        <div class="gantt-container">
            <div id="gantt-chart" style="width:100%; height:500px;"></div>
            <div class="gantt-controls">
                <button onclick="gantt.exportToPDF()">Exportar a PDF</button>
                <button onclick="gantt.exportToExcel()">Exportar a Excel</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.dhtmlx.com/gantt/edge/dhtmlxgantt.js"></script>
    <script src="https://export.dhtmlx.com/gantt/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('estimation-form');

            form.addEventListener('submit', (event) => {
                event.preventDefault();

                const model = {
                    scriptCount: parseInt(document.getElementById('script-count').value),
                    minLines: parseInt(document.getElementById('min-lines').value),
                    maxLines: parseInt(document.getElementById('max-lines').value),
                    person1Avg: parseInt(document.getElementById('person1-avg').value),
                    person2Avg: parseInt(document.getElementById('person2-avg').value) || 0,
                    startDate: new Date(document.getElementById('start-date').value),
                    dueDate: new Date(document.getElementById('due-date').value)
                };

                const controller = {
                    calculateAverageLines: () => (model.minLines + model.maxLines) / 2,

                    calculateTotalLines: () => controller.calculateAverageLines() * model.scriptCount,

                    calculateCombinedDailyRate: () => model.person1Avg + model.person2Avg,

                    calculateDaysRequired: () => {
                        const totalLines = controller.calculateTotalLines();
                        const combinedRate = controller.calculateCombinedDailyRate();
                        return Math.ceil(totalLines / combinedRate);
                    },

                    calculateEndDate: () => {
                        let endDate = new Date(model.startDate.getTime());
                        let days = controller.calculateDaysRequired();
                        let addedDays = 0;
                        while (addedDays < days) {
                            endDate.setDate(endDate.getDate() + 1);
                            if (endDate.getDay() !== 0 && endDate.getDay() !== 6) {
                                addedDays++;
                            }
                        }
                        return endDate;
                    },

                    validateDueDate: (calculatedEndDate) => model.dueDate >= calculatedEndDate,

                    updateView: () => {
                        const calculatedEndDate = controller.calculateEndDate();
                        const validation = controller.validateDueDate(calculatedEndDate);

                        document.getElementById('estimation-date').textContent = new Date().toLocaleDateString();
                        document.getElementById('calculated-due-date').textContent = calculatedEndDate.toLocaleDateString();
                        document.getElementById('recommended-due-date').textContent = calculatedEndDate.toLocaleDateString();
                        document.getElementById('due-date-validation').textContent = validation ? 'La fecha es adecuada' : 'La fecha no es adecuada';

                        controller.createGanttChart(calculatedEndDate);
                    },

                    createGanttChart: (calculatedEndDate) => {
                        gantt.config.scale_unit = "day";
                        gantt.config.date_scale = "%d %M";
                        gantt.init("gantt-chart");

                        const tasks = [];
                        let currentDate = new Date(model.startDate.getTime());
                        const daysRequired = controller.calculateDaysRequired();

                        for (let i = 0; i < daysRequired; i++) {
                            tasks.push({
                                id: i + 1,
                                text: `Día ${i + 1}`,
                                start_date: new Date(currentDate),
                                duration: 1,
                                progress: 1
                            });

                            currentDate.setDate(currentDate.getDate() + 1);
                            while (currentDate.getDay() === 0 || currentDate.getDay() === 6) {
                                currentDate.setDate(currentDate.getDate() + 1);
                            }
                        }

                        gantt.parse({ data: tasks });
                    }
                };

                controller.updateView();
            });
        });
    </script>
</body>
</html>
